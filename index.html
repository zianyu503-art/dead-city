<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>死城突圍</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&family=Oswald:wght@400;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
  :root {
    color-scheme: dark;
    --fg: #e9e4da;
    --dim: #9a948a;
    --accent: #c8321e;
    --accent2: #e8b44a;
    --panel: rgba(12, 12, 12, 0.72);
    --line: rgba(255, 255, 255, 0.14);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; color: var(--fg);
    font-family: "Noto Sans TC", system-ui, sans-serif; user-select: none; }
  #game canvas { display: block; }
  .num { font-family: "Oswald", "Noto Sans TC", sans-serif; }

  /* ---------- HUD ---------- */
  #hud { position: fixed; inset: 0; pointer-events: none; display: none; }
  #vignette { position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.55) 100%); }
  #hurt { position: fixed; inset: 0; pointer-events: none; opacity: 0;
    background: radial-gradient(ellipse at center, transparent 35%, rgba(150,0,0,0.75) 100%); }
  #crosshair { position: absolute; left: 50%; top: 50%; width: 0; height: 0; }
  #crosshair i { position: absolute; background: rgba(255,255,255,0.9); box-shadow: 0 0 2px #000; }
  #crosshair .t, #crosshair .b { width: 2px; height: 9px; left: -1px; }
  #crosshair .l, #crosshair .r { height: 2px; width: 9px; top: -1px; }
  #crosshair .d { width: 2px; height: 2px; left: -1px; top: -1px; }
  #hitmark { position: absolute; left: 50%; top: 50%; width: 26px; height: 26px; margin: -13px 0 0 -13px; opacity: 0; }
  #hitmark::before, #hitmark::after { content: ""; position: absolute; left: 12px; top: -2px; width: 2px; height: 30px;
    background: #fff; transform: rotate(45deg); box-shadow: 0 0 2px #000; }
  #hitmark::after { transform: rotate(-45deg); }
  #hitmark.kill::before, #hitmark.kill::after { background: #ff3b2a; }

  #topbar { position: absolute; top: 18px; left: 50%; transform: translateX(-50%); text-align: center;
    text-shadow: 0 1px 3px #000; }
  #lvname { font-size: 13px; letter-spacing: 0.2em; color: var(--dim); }
  #wave { font-size: 22px; font-weight: 700; margin-top: 2px; }
  #remain { font-size: 13px; color: var(--accent2); margin-top: 2px; }
  #score { position: absolute; top: 18px; right: 22px; text-align: right; text-shadow: 0 1px 3px #000; }
  #score .big { font-size: 28px; }
  #score .small { font-size: 12px; color: var(--dim); letter-spacing: 0.1em; }

  #health { position: absolute; left: 22px; bottom: 22px; width: 260px; text-shadow: 0 1px 3px #000; }
  #health .label { font-size: 12px; letter-spacing: 0.2em; color: var(--dim); }
  #hpnum { font-size: 38px; line-height: 1; }
  #hpbar { height: 6px; background: rgba(255,255,255,0.12); margin-top: 6px; }
  #hpfill { height: 100%; background: linear-gradient(90deg, #b8261a, #e54a33); width: 100%; transition: width 0.15s; }

  #ammo { position: absolute; right: 22px; bottom: 22px; text-align: right; text-shadow: 0 1px 3px #000; }
  #wname { font-size: 13px; letter-spacing: 0.15em; color: var(--dim); }
  #ammonum { font-size: 44px; line-height: 1; }
  #ammonum small { font-size: 22px; color: var(--dim); }
  #reloadtip { font-size: 13px; color: var(--accent2); height: 18px; }
  #slots { display: flex; gap: 6px; justify-content: flex-end; margin-top: 6px; }
  #slots span { font-size: 11px; padding: 2px 7px; border: 1px solid var(--line); color: var(--dim); }
  #slots span.on { border-color: var(--fg); color: var(--fg); }

  #msg { position: absolute; top: 30%; left: 50%; transform: translate(-50%, -50%); text-align: center;
    opacity: 0; transition: opacity 0.4s; text-shadow: 0 2px 8px #000; }
  #msg .m1 { font-size: 44px; font-weight: 900; letter-spacing: 0.08em; }
  #msg .m2 { font-size: 16px; color: var(--accent2); margin-top: 6px; letter-spacing: 0.1em; }

  /* ---------- overlays ---------- */
  .overlay { position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    flex-direction: column; background: rgba(0,0,0,0.55); backdrop-filter: blur(3px); z-index: 10; padding: 16px; }
  .overlay.show { display: flex; }
  #menu { background: linear-gradient(180deg, rgba(0,0,0,0.25) 0%, rgba(0,0,0,0.75) 100%); backdrop-filter: none;
    justify-content: flex-end; padding-bottom: 6vh; }
  .title { font-size: clamp(44px, 8vw, 96px); font-weight: 900; letter-spacing: 0.12em; line-height: 1;
    text-shadow: 0 4px 24px rgba(0,0,0,0.8); }
  .title span { color: var(--accent); }
  .subtitle { font-family: "Oswald"; letter-spacing: 0.6em; color: var(--dim); margin: 10px 0 34px; font-size: 14px; }
  #levels { display: grid; grid-template-columns: repeat(5, minmax(0, 190px)); gap: 12px; max-width: 100%; }
  .card { pointer-events: auto; cursor: pointer; border: 1px solid var(--line); padding: 14px 14px 16px; min-height: 150px;
    position: relative; overflow: hidden; transition: transform 0.15s, border-color 0.15s; text-align: left; color: var(--fg);
    font: inherit; }
  .card:hover:not(.locked) { transform: translateY(-3px); border-color: var(--fg); }
  .card .n { font-family: "Oswald"; font-size: 34px; opacity: 0.35; line-height: 1; }
  .card .nm { font-size: 17px; font-weight: 700; margin-top: 8px; }
  .card .tm { font-size: 11px; letter-spacing: 0.2em; color: var(--accent2); margin-top: 3px; }
  .card .ds { font-size: 12px; color: #cfc8bb; margin-top: 8px; line-height: 1.5; }
  .card.locked { cursor: not-allowed; filter: grayscale(1) brightness(0.5); }
  .card.locked::after { content: "未解鎖"; position: absolute; right: 10px; top: 12px; font-size: 11px; letter-spacing: 0.15em; }
  .t-day { background: linear-gradient(160deg, rgba(90,120,150,0.55), rgba(20,20,20,0.85)); }
  .t-dusk { background: linear-gradient(160deg, rgba(190,100,50,0.55), rgba(20,15,15,0.85)); }
  .t-night { background: linear-gradient(160deg, rgba(30,40,80,0.7), rgba(5,5,10,0.9)); }
  .t-fog { background: linear-gradient(160deg, rgba(130,140,140,0.55), rgba(20,20,20,0.85)); }
  .controls { margin-top: 26px; font-size: 12px; color: var(--dim); letter-spacing: 0.05em; text-align: center; line-height: 1.9; }
  .controls b { color: var(--fg); font-weight: 400; border: 1px solid var(--line); padding: 1px 6px; margin: 0 2px; }
  .panel { background: var(--panel); border: 1px solid var(--line); padding: 34px 44px; text-align: center; min-width: 320px; }
  .panel h2 { font-size: 40px; font-weight: 900; letter-spacing: 0.1em; }
  .panel p { color: var(--dim); margin: 10px 0 22px; line-height: 1.7; }
  .btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  button.b { font: inherit; font-size: 15px; letter-spacing: 0.12em; color: var(--fg); background: transparent;
    border: 1px solid var(--fg); padding: 10px 24px; cursor: pointer; }
  button.b:hover { background: var(--fg); color: #000; }
  button.b.primary { background: var(--accent); border-color: var(--accent); }
  button.b.primary:hover { background: #e2412b; color: #fff; }
  #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #000;
    z-index: 20; letter-spacing: 0.3em; color: var(--dim); }
  .touchnote { display: none; margin-top: 10px; color: var(--accent2); font-size: 13px; }
  .is-touch .touchnote { display: block; }
  .is-touch .keyhelp { display: none; }
  html.is-touch, .is-touch body { overscroll-behavior: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  .is-touch #game { touch-action: none; }

  /* ---------- touch controls ---------- */
  #touch { position: fixed; inset: 0; display: none; z-index: 5; touch-action: none; }
  .is-touch #touch.on { display: block; }
  #stick { position: absolute; width: 130px; height: 130px; margin: -65px 0 0 -65px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.28); background: rgba(0,0,0,0.18); display: none; pointer-events: none; }
  #knob { position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 50%;
    background: rgba(255,255,255,0.35); border: 2px solid rgba(255,255,255,0.6); }
  #stickHint { position: absolute; left: max(40px, env(safe-area-inset-left, 0px)); bottom: 40px; width: 110px; height: 110px;
    border-radius: 50%; border: 2px dashed rgba(255,255,255,0.18); pointer-events: none; }
  .tb { position: absolute; border-radius: 50%; border: 2px solid rgba(255,255,255,0.45); background: rgba(0,0,0,0.3);
    color: #fff; font: 700 13px "Noto Sans TC", sans-serif; display: flex; align-items: center; justify-content: center;
    touch-action: none; -webkit-tap-highlight-color: transparent; }
  .tb.down { background: rgba(255,255,255,0.35); }
  #tFire { width: 92px; height: 92px; right: max(34px, env(safe-area-inset-right, 0px)); bottom: 110px; border-color: rgba(230,70,50,0.8);
    background: rgba(160,30,20,0.35); font-size: 15px; }
  #tAim { width: 62px; height: 62px; right: calc(max(34px, env(safe-area-inset-right, 0px)) + 110px); bottom: 170px; }
  #tJump { width: 62px; height: 62px; right: calc(max(34px, env(safe-area-inset-right, 0px)) + 110px); bottom: 90px; }
  #tReload { width: 54px; height: 54px; right: calc(max(34px, env(safe-area-inset-right, 0px)) + 40px); bottom: 220px; }
  #tSwitch { width: 54px; height: 54px; right: calc(max(34px, env(safe-area-inset-right, 0px)) - 10px); bottom: 26px; border-radius: 12px; width: 110px; }
  #tPause { width: 44px; height: 44px; left: max(16px, env(safe-area-inset-left, 0px)); top: 14px; border-radius: 10px; }
  .is-touch #ammo { bottom: auto; right: auto; top: 128px; left: max(16px, env(safe-area-inset-left, 0px)); text-align: left; }
  .is-touch #msg { top: 42%; }
  #msg { width: min(92vw, 760px); }
  @media (max-width: 500px) { #msg .m1 { font-size: 24px; } #msg .m2 { font-size: 13px; } }
  .is-touch #slots { display: none; }
  .is-touch #health { bottom: auto; top: 70px; left: max(16px, env(safe-area-inset-left, 0px)); width: 180px; }
  .is-touch #hpnum { font-size: 26px; }
  .is-touch #ammonum { font-size: 30px; }
  .is-touch #score { top: 14px; }
  .is-touch #msg .m1 { font-size: 30px; }
  #rotate { position: fixed; inset: 0; z-index: 30; background: #000; display: none; align-items: center; justify-content: center;
    flex-direction: column; gap: 14px; text-align: center; padding: 24px; letter-spacing: 0.1em; }
  #rotate .ph { width: 46px; height: 80px; border: 3px solid var(--fg); border-radius: 8px; animation: rot 2s ease-in-out infinite; }
  @keyframes rot { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(90deg); } }
  @media (orientation: portrait) { .is-touch:not(.allow-portrait) #rotate { display: flex; } }
  #rotate button { margin-top: 8px; }
  .card.sel { border-color: var(--accent2); box-shadow: 0 0 0 2px var(--accent2); }
  .padhelp, .has-pad .is-touch .padhelp { display: none; }
  .has-pad .padhelp { display: block; margin-top: 6px; color: var(--accent2); }
  #quality { pointer-events: auto; margin-top: 12px; font-size: 13px; padding: 6px 16px; }
  #nosupport { display: none; }
  @media (max-height: 520px) {
    #menu { justify-content: flex-start; padding-top: 14px; padding-bottom: 14px; overflow-y: auto; }
    .title { font-size: 40px; } .subtitle { margin: 4px 0 12px; }
    #menu #levels { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
    .card { min-height: 0; padding: 10px; } .card .n { font-size: 22px; } .card .ds { display: none; }
    .controls { margin-top: 10px; }
    .panel { padding: 20px 26px; } .panel h2 { font-size: 28px; }
  }
  @media (max-width: 1000px) { #levels { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
</style>

<body>
<div id="game"></div>
<div id="vignette"></div>
<div id="hurt"></div>

<div id="hud">
  <div id="crosshair"><i class="t"></i><i class="b"></i><i class="l"></i><i class="r"></i><i class="d"></i></div>
  <div id="hitmark"></div>
  <div id="topbar"><div id="lvname"></div><div id="wave"></div><div id="remain"></div></div>
  <div id="score"><div class="small">擊殺</div><div class="big num" id="kills">0</div>
    <div class="small">分數 <span class="num" id="pts">0</span></div></div>
  <div id="health"><div class="label">生命值</div><div id="hpnum" class="num">100</div>
    <div id="hpbar"><div id="hpfill"></div></div></div>
  <div id="ammo"><div id="wname"></div><div id="reloadtip"></div>
    <div id="ammonum" class="num">12 <small>/ 72</small></div>
    <div id="slots"><span>1 手槍</span><span>2 步槍</span><span>3 霰彈槍</span></div></div>
  <div id="msg"><div class="m1"></div><div class="m2"></div></div>
</div>

<div id="menu" class="overlay show">
  <div class="title">死城<span>突圍</span></div>
  <div class="subtitle">DEAD CITY</div>
  <div id="levels"></div>
  <button class="b" id="quality">畫質：自動</button>
  <div class="controls">
    <span class="keyhelp"><b>W A S D</b> 移動　<b>Shift</b> 衝刺　<b>空白鍵</b> 跳躍　<b>滑鼠左鍵</b> 射擊　<b>右鍵</b> 瞄準<br>
    <b>R</b> 換彈　<b>1 2 3</b> / 滾輪 切換武器　<b>Esc</b> 暫停　·　</span>爆頭傷害 ×2.5
    <div class="padhelp">已連接手把：左右選擇關卡，A 開始。</div>
    <div class="touchnote">觸控模式：左半邊拖曳移動（推到底會衝刺），右半邊滑動轉視角，按住「射擊」可邊射邊轉。</div>
  </div>
</div>

<div id="pause" class="overlay"><div class="panel"><h2>暫停</h2><p>點擊「繼續」回到戰場</p>
  <div class="btns"><button class="b primary" id="btnResume">繼續</button><button class="b" id="btnQuit">返回選單</button></div></div></div>

<div id="dead" class="overlay"><div class="panel"><h2 style="color:var(--accent)">你已陣亡</h2><p id="deadStats"></p>
  <div class="btns"><button class="b primary" id="btnRetry">重新挑戰</button><button class="b" id="btnQuit2">返回選單</button></div></div></div>

<div id="win" class="overlay"><div class="panel"><h2>區域已肅清</h2><p id="winStats"></p>
  <div class="btns"><button class="b primary" id="btnNext">下一關</button><button class="b" id="btnQuit3">返回選單</button></div></div></div>

<div id="touch">
  <div id="stickHint"></div>
  <div id="stick"><div id="knob"></div></div>
  <div class="tb" id="tFire">射擊</div>
  <div class="tb" id="tAim">瞄準</div>
  <div class="tb" id="tJump">跳</div>
  <div class="tb" id="tReload">換彈</div>
  <div class="tb" id="tSwitch">換槍</div>
  <div class="tb" id="tPause">❚❚</div>
</div>
<div id="rotate"><div class="ph"></div><div>橫放手機，畫面和操作空間比較大</div><button class="b" id="btnPortrait">直接直向玩</button></div>

<div id="loading">載入中…</div>
<script>
  setTimeout(function () {
    var l = document.getElementById('loading');
    if (l && l.style.display !== 'none' && !l.dataset.err) {
      l.innerHTML = '載入失敗。請確認網路連線正常，<br>或改用最新版的 Chrome、Safari、Edge 或 Firefox。';
      l.style.textAlign = 'center'; l.style.lineHeight = '2'; l.style.padding = '24px';
    }
  }, 15000);
</script>

const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

function makeCanvas(w, h = w) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; return [c, c.getContext('2d')];
}
function toTex(c, srgb = true) {
  const t = new THREE.CanvasTexture(c);

  leg: new THREE.CapsuleGeometry(0.088, 0.72, 4, 10),
  shoe: new THREE.BoxGeometry(0.12, 0.08, 0.27),
  wheel: new THREE.CylinderGeometry(0.34, 0.34, 0.24, 18),
  particle: new THREE.BoxGeometry(0.045, 0.045, 0.045),
  decal: new THREE.PlaneGeometry(0.13, 0.13),
  pool: new THREE.PlaneGeometry(1.8, 1.8),
  pickup: new THREE.BoxGeometry(0.5, 0.32, 0.36),
};
G.wheel.rotateZ(Math.PI / 2);

// ============================================================
//  Level construction
// ============================================================
const N = 5, P = 56, ROAD = 12, HALF = N * P / 2; // 5x5 city blocks, 12 m roads
const ROAD_CENTERS = []; for (let i = 0; i <= N; i++) ROAD_CENTERS.push(-HALF + i * P);
const BOUND = HALF + ROAD / 2 - 0.6;
const blockCenter = (i) => -HALF + P / 2 + i * P;

let LV = LEVELS[0], TM = TIMES.day, levelIndex = 0;
let levelGroup = null;
let colliders = [], worldMeshes = [], lampPositions = [];
let M = {}; // per-level materials

function std(opts) { return new THREE.MeshStandardMaterial(opts); }

function makeMaterials() {
  const night = TM.night;
  const winI = night ? 1.6 : 0;
  const fac = (set) => set.map((t) => std({ map: t.map, roughness: 0.82, metalness: 0.05,
    emissive: 0xffffff, emissiveMap: t.em, emissiveIntensity: winI }));
  M = {
    asphalt: std({ map: TEX.asphalt, roughness: 0.93 }),
    pave: std({ map: TEX.pave, roughness: 0.9 }),
    slab: std({ map: TEX.slab, roughness: 0.92 }),
    grass: std({ map: TEX.grass, roughness: 1 }),
    roof: std({ map: TEX.roof, roughness: 0.95 }),
    shingle: std({ map: TEX.shingle, roughness: 0.9 }),
    office: fac(TEX.facades.office), brick: fac(TEX.facades.brick),
    house: fac(TEX.facades.house), warehouse: TEX.facades.warehouse.map((t) => std({ map: t.map, roughness: 0.6, metalness: 0.4,
      emissive: 0xffffff, emissiveMap: t.em, emissiveIntensity: winI })),
    containers: TEX.containers.map((t) => std({ map: t, roughness: 0.65, metalness: 0.35 })),
    concrete: std({ color: 0xa8a39a, roughness: 0.9, map: TEX.slab }),
    metal: std({ color: 0x3a3c3f, roughness: 0.5, metalness: 0.7 }),
    lampHead: std({ color: 0x222222, emissive: 0xffd49a, emissiveIntensity: night ? 6 : 0 }),
    glass: std({ color: 0x0e1418, roughness: 0.08, metalness: 0.9 }),
    tire: std({ color: 0x151515, roughness: 0.9 }),
    headL: std({ color: 0xdddddd, emissive: 0xfff4dd, emissiveIntensity: 0 }),
    tailL: std({ color: 0x550000, emissive: 0xff1a0a, emissiveIntensity: night ? 0.6 : 0 }),
    burnt: std({ color: 0x2a2521, roughness: 0.95, metalness: 0.3, map: TEX.containers[0] }),
    trunk: std({ color: 0x3d2e22, roughness: 1 }),
    leaves: std({ color: 0xffffff, roughness: 0.95 }),
    marking: std({ color: 0xd8d6cc, roughness: 0.8 }),
    door: std({ color: 0x4a3222, roughness: 0.7 }),
    bench: std({ color: 0x5a4030, roughness: 0.8 }),
    carPaints: [0x7a1c1c, 0x1c2f4f, 0xb8b6b0, 0x222222, 0x3d4a3a, 0x8a7a5a, 0x4a4f55, 0x9a9890].map((c) =>
      std({ color: c, roughness: 0.35, metalness: 0.6 })),
  };
}

function addCollider(x, z, w, d) { colliders.push({ x0: x - w / 2, x1: x + w / 2, z0: z - d / 2, z1: z + d / 2 }); }

function mesh(geo, mat, parent, x, y, z, shadow = true) {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  m.castShadow = shadow; m.receiveShadow = true;
  parent.add(m);
  return m;
}
function boxMesh(parent, x, y, z, w, h, d, mat, shootable = true) {
  const m = mesh(G.box, mat, parent, x, y, z);
  m.scale.set(w, h, d);
  if (shootable) worldMeshes.push(m);
  return m;
}

function addBuilding(g, x, z, w, d, h, mat, roofMat, collide = true, props = true) {
  const geo = new THREE.BoxGeometry(w, h, d);
  scaleBoxUV(geo, w, h, d, 16, 14);
  const m = mesh(geo, [mat, mat, roofMat, roofMat, mat, mat], g, x, h / 2 + 0.1, z);
  worldMeshes.push(m);
  if (collide) addCollider(x, z, w + 0.1, d + 0.1);
  // parapet + rooftop clutter
  boxMesh(g, x, h + 0.35, z - d / 2 + 0.15, w, 0.5, 0.3, M.concrete, false);
  boxMesh(g, x, h + 0.35, z + d / 2 - 0.15, w, 0.5, 0.3, M.concrete, false);
  boxMesh(g, x - w / 2 + 0.15, h + 0.35, z, 0.3, 0.5, d, M.concrete, false);
  boxMesh(g, x + w / 2 - 0.15, h + 0.35, z, 0.3, 0.5, d, M.concrete, false);
  if (props) for (let i = 0; i < randi(1, 3); i++) {
    const bw = rand(1.5, 3), bh = rand(1, 2.2);
    boxMesh(g, x + rand(-w / 3, w / 3), h + bh / 2 + 0.1, z + rand(-d / 3, d / 3), bw, bh, rand(1.5, 3), M.metal, false);
  }
}

function addHouse(g, x, z, face, trees) {
  const w = pick([8, 10]), d = 8, h = 7;
  const [W, D] = (face === 'x+' || face === 'x-') ? [d, w] : [w, d];
  const mat = pick(M.house);
  const geo = new THREE.BoxGeometry(W, h, D); scaleBoxUV(geo, W, h, D, 16, 14);
  const m = mesh(geo, [mat, mat, M.roof, M.roof, mat, mat], g, x, h / 2 + 0.15, z);
  worldMeshes.push(m); addCollider(x, z, W + 0.1, D + 0.1);
  const roof = mesh(new THREE.ConeGeometry(Math.SQRT1_2 * 1.12, 1, 4, 1), M.shingle, g, x, h + 0.15 + 1.6, z);
  roof.rotation.y = Math.PI / 4; roof.scale.set(W, 3.2, D);
  worldMeshes.push(roof);
  const dir = { 'x+': [1, 0], 'x-': [-1, 0], 'z+': [0, 1], 'z-': [0, -1] }[face];
  const door = boxMesh(g, x + dir[0] * (W / 2 + 0.03), 1.2, z + dir[1] * (D / 2 + 0.03), dir[0] ? 0.08 : 1.1, 2.2, dir[1] ? 0.08 : 1.1, M.door);
  // porch light position for night
  lampPositions.push(new THREE.Vector3(x + dir[0] * (W / 2 + 0.6), 2.6, z + dir[1] * (D / 2 + 0.6)));
  trees.push([x - dir[0] * (W / 2 + 2.5) + rand(-2, 2), z - dir[1] * (D / 2 + 2.5) + rand(-2, 2), rand(0.8, 1.2)]);
}

function addCar(g, x, z, rot, wrecked = false) {
  const car = new THREE.Group();
  const paint = wrecked ? M.burnt : pick(M.carPaints);
  const body = boxMesh(car, 0, 0.62, 0, 1.82, 0.62, 4.4, paint);
  boxMesh(car, 0, 0.38, 0, 1.7, 0.2, 4.2, M.tire, false);
  const cab = boxMesh(car, 0, 1.18, -0.15, 1.62, 0.55, 2.3, M.glass);
  boxMesh(car, 0, 1.47, -0.15, 1.5, 0.05, 1.9, paint, false);
  for (const sx of [-0.84, 0.84]) for (const sz of [-1.38, 1.38]) mesh(G.wheel, M.tire, car, sx, 0.34, sz);
  if (!wrecked) {
    for (const sx of [-0.62, 0.62]) {
      boxMesh(car, sx, 0.72, 2.21, 0.35, 0.14, 0.04, M.headL, false);
      boxMesh(car, sx, 0.74, -2.21, 0.35, 0.12, 0.04, M.tailL, false);
    }
  }
  car.position.set(x, 0, z); car.rotation.y = rot;
  if (wrecked) { car.rotation.z = rand(-0.06, 0.06); car.position.y = -0.1; }
  g.add(car);
  const c = Math.abs(Math.cos(rot)), s = Math.abs(Math.sin(rot));
  addCollider(x, z, 1.9 * c + 4.5 * s, 1.9 * s + 4.5 * c);
}

function buildLevel() {
  if (levelGroup) {
    scene.remove(levelGroup);
    levelGroup.traverse((o) => { if (o.geometry && !Object.values(G).includes(o.geometry)) o.geometry.dispose(); });
  }
  levelGroup = new THREE.Group(); scene.add(levelGroup);
  colliders = []; worldMeshes = []; lampPositions = [];
  makeMaterials();
  const g = levelGroup, theme = LV.theme;

  // ground (roads)
  const ground = mesh(new THREE.PlaneGeometry(900, 900), M.asphalt, g, 0, 0, 0, false);
  ground.rotation.x = -Math.PI / 2; worldMeshes.push(ground);
  M.asphalt.map.repeat.set(900 / 16, 900 / 16);

  const lamps = [], trees = [], contInst = TEX.containers.map(() => []);

  for (let bi = -1; bi <= N; bi++) for (let bj = -1; bj <= N; bj++) {
    const inside = bi >= 0 && bi < N && bj >= 0 && bj < N;
    const cx = blockCenter(bi), cz = blockCenter(bj);
    const bs = P - ROAD; // 44
    // block slab / sidewalk
    const slabMat = theme === 'industrial' ? M.slab : M.pave;
    const sgeo = new THREE.BoxGeometry(bs, 0.16, bs); scaleBoxUV(sgeo, bs, 0.16, bs, 3, 3);
    const slab = mesh(sgeo, slabMat, g, cx, 0.08, cz, false); worldMeshes.push(slab);
    if (inside) for (const [ex, ez, rot] of [[1, 0, Math.PI / 2], [-1, 0, -Math.PI / 2], [0, 1, 0], [0, -1, Math.PI]]) {
      for (const off of [-14, 0, 14]) {
        lamps.push([cx + ex * 21.2 + (ez ? off : 0), cz + ez * 21.2 + (ex ? off : 0), rot]);
      }
    }
    const r = Math.random();
    if (theme === 'downtown') {
      if (inside && r < 0.1) { // parking lot
        const lot = mesh(new THREE.PlaneGeometry(38, 38), M.asphalt, g, cx, 0.17, cz, false); lot.rotation.x = -Math.PI / 2;
        for (let k = 0; k < 7; k++) addCar(g, cx - 15 + k * 5, cz + rand(-1, 1) + (Math.random() < 0.5 ? -8 : 8), Math.random() < 0.15 ? rand(0, 6) : 0, Math.random() < 0.2);
      } else if (inside && r < 0.18) { // park
        const pk = mesh(new THREE.PlaneGeometry(38, 38), M.grass, g, cx, 0.17, cz, false); pk.rotation.x = -Math.PI / 2;
        M.grass.map.repeat.set(10, 10);
        for (let k = 0; k < 10; k++) trees.push([cx + rand(-16, 16), cz + rand(-16, 16), rand(0.9, 1.4)]);
        for (let k = 0; k < 4; k++) { const bx = cx + rand(-12, 12), bz = cz + rand(-12, 12); boxMesh(g, bx, 0.6, bz, 2, 0.1, 0.6, M.bench); addCollider(bx, bz, 2, 0.6); }
      } else if (r < 0.32) {
        const w = pick([28, 32, 36]), d = pick([28, 32, 36]);
        addBuilding(g, cx, cz, w, d, randi(10, 22) * 3.5, pick(M.office), M.roof, inside);
      } else {
        for (const ox of [-9.5, 9.5]) for (const oz of [-9.5, 9.5]) {
          const brick = Math.random() < 0.4;
          const w = pick([12, 16]), d = pick([12, 16]);
          const floors = brick ? randi(3, 7) : randi(6, 17);
          addBuilding(g, cx + ox + rand(-1, 1), cz + oz + rand(-1, 1), w, d, floors * 3.5, brick ? pick(M.brick) : pick(M.office), M.roof, inside);
        }
      }
    } else if (theme === 'suburb') {
      const gr = mesh(new THREE.PlaneGeometry(38, 38), M.grass, g, cx, 0.17, cz, false); gr.rotation.x = -Math.PI / 2;
      M.grass.map.repeat.set(10, 10);
      const L = 12.7;
      for (const ox of [-1, 0, 1]) for (const oz of [-1, 0, 1]) {
        if (!ox && !oz) { for (let k = 0; k < 3; k++) trees.push([cx + rand(-4, 4), cz + rand(-4, 4), rand(1, 1.5)]); continue; }
        if (!inside) { addHouse(g, cx + ox * L, cz + oz * L, ox ? (ox > 0 ? 'x+' : 'x-') : (oz > 0 ? 'z+' : 'z-'), trees); colliders.pop(); continue; }
        const face = Math.abs(ox) >= Math.abs(oz) && ox ? (ox > 0 ? 'x+' : 'x-') : (oz > 0 ? 'z+' : 'z-');
        addHouse(g, cx + ox * L, cz + oz * L, face, trees);
      }
    } else { // industrial
      if (r < 0.45) {
        const along = Math.random() < 0.5;
        const w = along ? 34 : 16, d = along ? 16 : 34;
        addBuilding(g, cx + (along ? 0 : -9), cz + (along ? -9 : 0), w, d, randi(2, 3) * 3.5, pick(M.warehouse), M.roof, inside, false);
        if (inside) for (let k = 0; k < 3; k++) {
          const px = cx + (along ? -12 + k * 12 : 10), pz = cz + (along ? 10 : -12 + k * 12);
          stackContainers(px, pz, along ? 0 : Math.PI / 2, contInst, inside);
        }
      } else if (inside) {
        for (let row = 0; row < 3; row++) for (let k = 0; k < 2; k++) {
          if (Math.random() < 0.2) continue;
          stackContainers(cx - 8 + k * 16, cz - 12 + row * 12, 0, contInst, inside);
        }
      } else {
        addBuilding(g, cx, cz, 34, 34, randi(2, 4) * 3.5, pick(M.warehouse), M.roof, false, false);
      }
    }
  }

  // containers (instanced per colour)
  contInst.forEach((list, ci) => {
    if (!list.length) return;
    const im = new THREE.InstancedMesh(G.box, M.containers[ci], list.length);
    list.forEach((mtx, k) => im.setMatrixAt(k, mtx));
    im.castShadow = im.receiveShadow = true; g.add(im); worldMeshes.push(im);
  });

  // street lamps (instanced)
  const poleG = new THREE.CylinderGeometry(0.07, 0.11, 7, 8); poleG.translate(0, 3.5, 0);
  const armG = new THREE.BoxGeometry(0.08, 0.08, 1.7); armG.translate(0, 6.9, 0.8);
  const headG = new THREE.BoxGeometry(0.34, 0.12, 0.62); headG.translate(0, 6.82, 1.55);
  const imP = new THREE.InstancedMesh(poleG, M.metal, lamps.length);
  const imA = new THREE.InstancedMesh(armG, M.metal, lamps.length);
  const imH = new THREE.InstancedMesh(headG, M.lampHead, lamps.length);
  const mtx = new THREE.Matrix4(), q = new THREE.Quaternion(), one = new THREE.Vector3(1, 1, 1), up = new THREE.Vector3(0, 1, 0);
  lamps.forEach(([x, z, rot], k) => {
    q.setFromAxisAngle(up, rot); mtx.compose(new THREE.Vector3(x, 0.16, z), q, one);
    imP.setMatrixAt(k, mtx); imA.setMatrixAt(k, mtx); imH.setMatrixAt(k, mtx);
    lampPositions.push(new THREE.Vector3(x + Math.sin(rot) * 1.55, 6.3, z + Math.cos(rot) * 1.55));
    addCollider(x, z, 0.3, 0.3);
  });
  imP.castShadow = imA.castShadow = true;
  g.add(imP, imA, imH); worldMeshes.push(imP);

  // trees (instanced)
  if (trees.length) {
    const trG = new THREE.CylinderGeometry(0.14, 0.22, 3.2, 7); trG.translate(0, 1.6, 0);
    const lfG = new THREE.IcosahedronGeometry(2, 1); lfG.translate(0, 4.4, 0);
    const imT = new THREE.InstancedMesh(trG, M.trunk, trees.length);
    const imL = new THREE.InstancedMesh(lfG, M.leaves, trees.length);
    const col = new THREE.Color();
    trees.forEach(([x, z, s], k) => {
      q.setFromAxisAngle(up, rand(0, 6)); mtx.compose(new THREE.Vector3(x, 0.16, z), q, new THREE.Vector3(s, s * rand(0.9, 1.2), s));
      imT.setMatrixAt(k, mtx); imL.setMatrixAt(k, mtx);
      const dusk = TM === TIMES.dusk;
      col.setHSL(rand(0.2, 0.3) - (dusk ? 0.05 : 0), rand(0.3, 0.5), rand(0.16, 0.26)); imL.setColorAt(k, col);
      if (Math.abs(x) < BOUND && Math.abs(z) < BOUND) addCollider(x, z, 0.5 * s, 0.5 * s);
    });
    imT.castShadow = imL.castShadow = true; imL.receiveShadow = true;
    g.add(imT, imL); worldMeshes.push(imT);
  }

  // road markings: centre dashes + crosswalks
  const dashes = [];
  for (const rc of ROAD_CENTERS) for (let t = -HALF - 30; t <= HALF + 30; t += 6) {
    if (ROAD_CENTERS.some((o) => Math.abs(o - t) < 10)) continue;
    dashes.push([rc, t, 0.15, 3]); dashes.push([t, rc, 3, 0.15]);
  }
  for (const a of ROAD_CENTERS) for (const b of ROAD_CENTERS) for (const s of [-1, 1]) for (let k = -5; k <= 5; k++) {
    dashes.push([a + k * 1.05, b + s * 8, 0.5, 3]); dashes.push([a + s * 8, b + k * 1.05, 3, 0.5]);
  }
  const dashG = new THREE.PlaneGeometry(1, 1); dashG.rotateX(-Math.PI / 2);
  const imD = new THREE.InstancedMesh(dashG, M.marking, dashes.length);
  dashes.forEach(([x, z, w, d], k) => { mtx.compose(new THREE.Vector3(x, 0.012, z), new THREE.Quaternion(), new THREE.Vector3(w, 1, d)); imD.setMatrixAt(k, mtx); });
  imD.receiveShadow = true; g.add(imD);

  // cars in the streets
  for (const rc of ROAD_CENTERS) for (let seg = 0; seg < N; seg++) {
    if (Math.abs(rc) > HALF - 1) continue;
    const t0 = blockCenter(seg);
    const cnt = randi(0, 2);
    for (let k = 0; k < cnt; k++) {
      const t = t0 + rand(-16, 16), side = pick([-4.3, 4.3]), abandoned = Math.random() < 0.3;
      const alongZ = Math.random() < 0.5;
      const off = abandoned ? rand(-2, 2) : side;
      const rot = (alongZ ? 0 : Math.PI / 2) + (abandoned ? rand(-0.8, 0.8) : (Math.random() < 0.5 ? 0 : Math.PI));
      if (alongZ) addCar(g, rc + off, t, rot, abandoned && Math.random() < 0.5);
      else addCar(g, t, rc + off, rot, abandoned && Math.random() < 0.5);
    }
  }

  // barricades at the map edge
  for (const rc of ROAD_CENTERS) for (const s of [-1, 1]) {
    const e = s * (HALF + ROAD / 2 + 0.5);
    for (let k = -5; k < 6; k += 2) {
      boxMesh(g, rc + k, 0.45, e, 1.9, 0.9, 0.6, M.concrete); boxMesh(g, e, 0.45, rc + k, 0.6, 0.9, 1.9, M.concrete);
    }
    if (Math.random() < 0.6) addCar(g, rc + rand(-3, 3), e + s * 4, rand(0, 6), true);
    if (Math.random() < 0.6) addCar(g, e + s * 4, rc + rand(-3, 3), rand(0, 6), true);
  }
  const B = HALF + ROAD / 2;
  addCollider(-B - 50, 0, 100, 1000); addCollider(B + 50, 0, 100, 1000);
  addCollider(0, -B - 50, 1000, 100); addCollider(0, B + 50, 1000, 100);
}

function stackContainers(x, z, rot, contInst, collide) {
  const h = randi(1, 3), q = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), rot);
  for (let k = 0; k < h; k++) {
    const ci = randi(0, TEX.containers.length - 1);
    const qq = q.clone().multiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), rand(-0.04, 0.04)));
    contInst[ci].push(new THREE.Matrix4().compose(new THREE.Vector3(x, 0.16 + 1.3 + k * 2.6, z), qq, new THREE.Vector3(2.44, 2.6, 6.06)));
  }
  if (collide) { const vert = Math.abs(Math.sin(rot)) > 0.5; addCollider(x, z, vert ? 6.2 : 2.6, vert ? 2.6 : 6.2); }
}

function applyTime() {
  const t = TM;
  renderer.toneMappingExposure = t.exp;
  scene.fog = new THREE.FogExp2(t.fog, t.fogD);
  hemi.color.set(t.hemiSky); hemi.groundColor.set(t.hemiGround); hemi.intensity = t.hemiI;
  sun.color.set(t.sun); sun.intensity = t.sunI;
  if (t.sky) {
    const u = sky.material.uniforms;
    u.turbidity.value = t.turb; u.rayleigh.value = t.ray; u.mieCoefficient.value = t.mie; u.mieDirectionalG.value = t.mieG;
    sunDir.setFromSphericalCoords(1, THREE.MathUtils.degToRad(90 - t.elev), THREE.MathUtils.degToRad(t.azi));
    u.sunPosition.value.copy(sunDir);
    const envScene = new THREE.Scene(); envScene.add(sky);
    if (envRT) envRT.dispose();
    envRT = pmrem.fromScene(envScene, 0, 0.1, 3000);
    scene.environment = gunScene.environment = envRT.texture;
    scene.environmentIntensity = t.envI; gunScene.environmentIntensity = 0.3;
    if (t.bgFog) { scene.background = new THREE.Color(t.fog); }
    else { scene.add(sky); scene.background = null; }
  } else {
    scene.remove(sky);
    sunDir.set(-0.4, 0.8, 0.3).normalize();
    scene.background = new THREE.Color(t.bg);
    scene.environment = null; gunScene.environment = null;
  }
  gunHemi.intensity = t.night ? 0.7 : 1.1; gunSun.intensity = t.night ? 0.5 : 1.8;
  gunHemi.color.set(t.hemiSky);
  flashlight.intensity = t.night ? 160 : (TM === TIMES.fog ? 40 : 0);
  bloom.strength = t.night ? 0.55 : 0.3;
}

// ============================================================
//  Collision
// ============================================================
function resolve(p, r) {
  for (const b of colliders) {
    if (p.x < b.x0 - r || p.x > b.x1 + r || p.z < b.z0 - r || p.z > b.z1 + r) continue;
    const cx = clamp(p.x, b.x0, b.x1), cz = clamp(p.z, b.z0, b.z1);
    const dx = p.x - cx, dz = p.z - cz, d2 = dx * dx + dz * dz;
    if (d2 >= r * r) continue;
    if (d2 > 1e-8) { const d = Math.sqrt(d2); p.x = cx + dx / d * r; p.z = cz + dz / d * r; }
    else {
      const pl = p.x - b.x0, pr = b.x1 - p.x, pb = p.z - b.z0, pf = b.z1 - p.z, m = Math.min(pl, pr, pb, pf);
      if (m === pl) p.x = b.x0 - r; else if (m === pr) p.x = b.x1 + r; else if (m === pb) p.z = b.z0 - r; else p.z = b.z1 + r;
    }
  }
}
function blocked(x, z, r) {

function spawnZombie(type) {
  for (let tries = 0; tries < 40; tries++) {
    const rc = pick(ROAD_CENTERS), t = rand(-HALF + 4, HALF - 4), off = rand(-4, 4);
    const [x, z] = Math.random() < 0.5 ? [rc + off, t] : [t, rc + off];

    const d = Math.hypot(x - player.pos.x, z - player.pos.z);

function loadLevel(i) {

function startLevel(i) {

  player.yaw = 0; player.pitch = 0; player.hp = 100; player.vy = 0; player.vel.set(0, 0, 0);
  wi = 1; resetWeapons(); reloading = 0; switching = 0;
  kills = 0; score = 0; waveIdx = 0; queue = []; waveActive = false; interT = 3;
  showMsg(`第 ${i + 1} 關 · ${LV.name}`, `${TIMES[LV.time].label} — 撐過 ${LV.waves.length} 波感染者`, 3);
  document.querySelectorAll('.overlay').forEach((o) => o.classList.remove('show'));

function startWave() {

  queue.sort(() => Math.random() - 0.5);

}

function updateWaves(dt) {
  if (!waveActive) {
    interT -= dt;
    if (interT <= 0) startWave();
    return;
  }
  const alive = zombies.filter((z) => !z.dead).length;
  if (queue.length && alive < QUALITY[qLevel].maxZ) {
    spawnT -= dt;
    if (spawnT <= 0) { if (spawnZombie(queue[0])) queue.shift(); spawnT = rand(0.4, 1.2); }
  }
  if (!queue.length && alive === 0) {
    waveActive = false;
    if (waveIdx >= LV.waves.length - 1) { levelComplete(); return; }
    waveIdx++; interT = 7;
    showMsg('本波已清除', '補給時間 — 撿起彈藥和醫療包', 3);
    const w = weapons[wi]; w.reserve += w.c.mag;
  }
}

function levelComplete() {

  if (levelIndex + 1 > loadUnlocked()) saveUnlocked(Math.min(LEVELS.length - 1, levelIndex + 1));
  unlockPointer();
  const last = levelIndex === LEVELS.length - 1;
  $('winStats').innerHTML = last ? `你守住了最後防線，撤離成功！<br>擊殺 ${kills} · 分數 ${score}` : `擊殺 ${kills} · 分數 ${score}<br>下一關已解鎖：${LEVELS[levelIndex + 1].name}`;
  $('btnNext').style.display = last ? 'none' : '';

}
function gameOver() {

  unlockPointer();
  $('deadStats').innerHTML = `第 ${levelIndex + 1} 關 · 第 ${waveIdx + 1} 波<br>擊殺 ${kills} · 分數 ${score}`;
  $('dead').classList.add('show');

function toMenu() {

  document.querySelectorAll('.overlay').forEach((o) => o.classList.remove('show'));
  $('menu').classList.add('show'); $('hud').style.display = 'none';

function renderMenu() {

  $('levels').innerHTML = '';
  LEVELS.forEach((l, i) => {
    const b = document.createElement('button');
    b.className = `card t-${l.time}` + (i > un ? ' locked' : '') + (padActive && i === menuSel ? ' sel' : '');
    b.innerHTML = `<div class="n">${String(i + 1).padStart(2, '0')}</div><div class="nm">${l.name}</div><div class="tm">${TIMES[l.time].label} · ${l.waves.length} 波</div><div class="ds">${l.desc}</div>`;
    if (i <= un) b.onclick = () => startLevel(i);

  player.vel.z += (wz * speed - player.vel.z) * Math.min(1, acc * dt);
  player.pos.x += player.vel.x * dt; player.pos.z += player.vel.z * dt;
  resolve(player.pos, 0.4);
  if (keys.Space && player.onGround) { player.vy = 5.2; player.onGround = false; }
  player.vy -= 15 * dt; player.pos.y += player.vy * dt;
  if (player.pos.y <= 0) { player.pos.y = 0; player.vy = 0; player.onGround = true; }
  if (touchJump) { keys.Space = false; touchJump = false; }
  const hs = Math.hypot(player.vel.x, player.vel.z);
  if (player.onGround) player.bob += hs * dt * 1.9;
  const bobY = Math.sin(player.bob * 2) * 0.035 * Math.min(1, hs / 5);
  shake = Math.max(0, shake - dt * 3);
  camera.position.set(player.pos.x, player.pos.y + 1.7 + bobY, player.pos.z);
  camera.rotation.set(player.pitch + rand(-1, 1) * shake * 0.01, player.yaw + rand(-1, 1) * shake * 0.01, 0);
  aimT += ((aiming && reloading <= 0 ? 1 : 0) - aimT) * Math.min(1, dt * 12);
  camera.fov = (camera.aspect < 1 ? 95 : 75) - aimT * (weapons[wi].c.id === 'rifle' ? 25 : 15); camera.updateProjectionMatrix();
  spreadK = Math.max(0, spreadK - dt * 2.5);
}

function updateWeapon(dt) {
  const w = weapons[wi], v = w.view;
  fireCd -= dt;
  if (switching > 0) switching -= dt;
  if (reloading > 0) {
    reloading -= dt;
    if (reloading <= 0) { const need = w.c.mag - w.ammo, take = Math.min(need, w.reserve); w.ammo += take; w.reserve -= take; }
  }
  if ((mouseDown || pad.fire) && w.c.auto) tryFire(false);
  kick = Math.max(0, kick - dt * 10);
  const hs = Math.hypot(player.vel.x, player.vel.z) / 5;
  const hip = v.hip.clone(); if (gunCam.aspect < 1) { hip.x *= 0.45; hip.z -= 0.08; }
  const pos = hip.lerp(v.aim, aimT);
  const bobA = (1 - aimT * 0.85);
  pos.x += Math.cos(player.bob) * 0.012 * hs * bobA;
  pos.y += Math.abs(Math.sin(player.bob)) * 0.012 * hs * bobA;
  pos.z += kick * 0.06 * (aimT > 0.5 ? 0.6 : 1);
  const rl = reloading > 0 ? Math.sin(Math.min(1, 1 - reloading / w.c.reload) * Math.PI) : 0;
  const sw = switching > 0 ? switching / 0.35 : 0;
  pos.y -= rl * 0.12 + sw * 0.3;
  v.group.position.copy(pos);
  v.group.rotation.set(kick * 0.12 - rl * 0.5, 0, rl * 0.4);
  v.flash.visible = flashT > 0;
  if (flashT > 0) { v.flash.material.rotation = rand(0, 6); v.flash.scale.setScalar(rand(0.16, 0.28) * (w.c.id === 'shotgun' ? 1.4 : 1)); }
  flashT -= dt;
  muzzleLight.intensity = flashT > 0 ? 45 : 0; gunMuzzle.intensity = flashT > 0 ? 6 : 0;
  gunMuzzle.position.copy(pos).add(v.muzzle);
}

function updateZombies(dt) {
  zombies = zombies.filter((z) => { const keep = z.update(dt); if (!keep) z.remove(); return keep; });
  groanT -= dt;
  if (groanT <= 0) {
    groanT = rand(1.2, 3);
    const near = zombies.filter((z) => !z.dead);
    if (near.length) groan(pick(near));
  }
}

function updatePickups(dt) {
  pickups = pickups.filter((p) => {
    p.t += dt; p.life -= dt;
    p.m.rotation.y += dt * 1.5; p.m.position.y = 0.4 + Math.sin(p.t * 3) * 0.08;
    if (Math.hypot(p.m.position.x - player.pos.x, p.m.position.z - player.pos.z) < 1.3) {
      if (p.kind === 'med') { if (player.hp >= 100) return true; player.hp = Math.min(100, player.hp + 35); showMsg('', '+35 生命值', 1); }
      else { weapons.forEach((w) => { w.reserve += Math.round(w.c.mag * (w === weapons[wi] ? 1.5 : 0.7)); }); showMsg('', '彈藥補給', 1); }
      sfx('pickup'); scene.remove(p.m); return false;
    }
    if (p.life <= 0) { scene.remove(p.m); return false; }
    return true;
  });
}

function updateParticles(dt) {
  particles = particles.filter((p) => {
    p.life -= dt; p.v.y -= 9.8 * dt; p.m.position.addScaledVector(p.v, dt);
    if (p.m.position.y < 0.02) { p.m.position.y = 0.02; p.v.set(0, 0, 0); }
    if (p.life <= 0) { scene.remove(p.m); return false; }
    return true;
  });
}

function updateLighting(dt) {
  const focus = state === 'playing' || state === 'paused' ? player.pos : new THREE.Vector3(0, 0, 0);
  sun.position.copy(focus).addScaledVector(sunDir, 150); sun.target.position.copy(focus);
  lampT -= dt;
  if (lampT <= 0 && TM.night) {
    lampT = 0.5;
    const sorted = lampPositions.slice().sort((a, b) => a.distanceToSquared(camera.position) - b.distanceToSquared(camera.position));
    LAMP_LIGHTS.forEach((l, i) => { if (sorted[i]) { l.position.copy(sorted[i]); l.intensity = sorted[i].y < 4 ? 14 : 70; } });
  } else if (!TM.night) LAMP_LIGHTS.forEach((l) => (l.intensity = 0));
}

let last = performance.now();
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  frame(dt, now);
}
function frame(dt, now) {
  pollPad(dt);
  if (state === 'playing') autoQuality(dt);
  if (state === 'playing') {
    updatePlayer(dt); updateWeapon(dt); updateZombies(dt); updateWaves(dt); updatePickups(dt);
    updateHUD();
  } else if (state === 'menu') {
    menuT += dt;
    const a = menuT * 0.04;
    camera.position.set(ROAD_CENTERS[3] + Math.sin(a) * 6, 5 + Math.sin(a * 0.7) * 1.5, blockCenter(4) - menuT * 0.8 % 200);
    camera.fov = 60; camera.updateProjectionMatrix();
    camera.lookAt(camera.position.x, 7, camera.position.z - 40);
    gunRoot.visible = false;
  }
  gunRoot.visible = state !== 'menu';
  updateParticles(dt); updateLighting(dt);
  if (msgTimer > 0) { msgTimer -= dt; if (msgTimer <= 0) $('msg').style.opacity = 0; }
  if (hitTimer > 0) { hitTimer -= dt; if (hitTimer <= 0) $('hitmark').style.opacity = 0; }
  hurtAlpha = Math.max(0, hurtAlpha - dt * 1.2);
  const low = state === 'playing' && player.hp < 30 ? 0.35 + Math.sin(now / 250) * 0.1 : 0;
  $('hurt').style.opacity = Math.max(hurtAlpha, low);
  composer.render(dt);
}

// ============================================================
//  Boot
// ============================================================
buildTextures();
loadLevel(0);
applyQuality(qLevel);
resetWeapons();
renderMenu();
$('loading').style.display = 'none';
requestAnimationFrame(loop);
window.__game = { get state() { return state; }, player, zombies: () => zombies, startLevel, spawnZombie,
  tick(n = 1, dt = 1 / 60) { for (let i = 0; i < n; i++) frame(dt, performance.now()); }, fire: () => tryFire(true) };
</script>
</body>
</html>
