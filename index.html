<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>死城突圍</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&family=Oswald:wght@400;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
  :root {
    color-scheme: dark;
    --fg: #e9e4da;
    --dim: #9a948a;
    --accent: #c8321e;
    --accent2: #e8b44a;
    --panel: rgba(12, 12, 12, 0.72);
    --line: rgba(255, 255, 255, 0.14);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; color: var(--fg);
    font-family: "Noto Sans TC", system-ui, sans-serif; user-select: none; }
  #game canvas { display: block; }
  .num { font-family: "Oswald", "Noto Sans TC", sans-serif; }

  /* ---------- HUD ---------- */
  #hud { position: fixed; inset: 0; pointer-events: none; display: none; }
  #vignette { position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.55) 100%); }
  #acidfx { position: fixed; inset: 0; pointer-events: none; opacity: 0;
    background: radial-gradient(ellipse at center, transparent 30%, rgba(90,200,30,0.6) 100%); }
  #hurt { position: fixed; inset: 0; pointer-events: none; opacity: 0;
    background: radial-gradient(ellipse at center, transparent 35%, rgba(150,0,0,0.75) 100%); }
  #crosshair { position: absolute; left: 50%; top: 50%; width: 0; height: 0; }
  #crosshair i { position: absolute; background: rgba(255,255,255,0.9); box-shadow: 0 0 2px #000; }
  #crosshair .t, #crosshair .b { width: 2px; height: 9px; left: -1px; }
  #crosshair .l, #crosshair .r { height: 2px; width: 9px; top: -1px; }
  #crosshair .d { width: 2px; height: 2px; left: -1px; top: -1px; }
  #hitmark { position: absolute; left: 50%; top: 50%; width: 26px; height: 26px; margin: -13px 0 0 -13px; opacity: 0; }
  #hitmark::before, #hitmark::after { content: ""; position: absolute; left: 12px; top: -2px; width: 2px; height: 30px;
    background: #fff; transform: rotate(45deg); box-shadow: 0 0 2px #000; }
  #hitmark::after { transform: rotate(-45deg); }
  #hitmark.kill::before, #hitmark.kill::after { background: #ff3b2a; }

  #topbar { position: absolute; top: 18px; left: 50%; transform: translateX(-50%); text-align: center;
    text-shadow: 0 1px 3px #000; }
  #lvname { font-size: 13px; letter-spacing: 0.2em; color: var(--dim); }
  #wave { font-size: 22px; font-weight: 700; margin-top: 2px; }
  #remain { font-size: 13px; color: var(--accent2); margin-top: 2px; }
  #score { position: absolute; top: 18px; right: 22px; text-align: right; text-shadow: 0 1px 3px #000; }
  #score .big { font-size: 28px; }
  #score .small { font-size: 12px; color: var(--dim); letter-spacing: 0.1em; }

  #health { position: absolute; left: 22px; bottom: 22px; width: 260px; text-shadow: 0 1px 3px #000; }
  #health .label { font-size: 12px; letter-spacing: 0.2em; color: var(--dim); }
  #hpnum { font-size: 38px; line-height: 1; }
  #hpbar { height: 6px; background: rgba(255,255,255,0.12); margin-top: 6px; }
  #hpfill { height: 100%; background: linear-gradient(90deg, #b8261a, #e54a33); width: 100%; transition: width 0.15s; }

  #ammo { position: absolute; right: 22px; bottom: 22px; text-align: right; text-shadow: 0 1px 3px #000; }
  #wname { font-size: 13px; letter-spacing: 0.15em; color: var(--dim); }
  #ammonum { font-size: 44px; line-height: 1; }
  #ammonum small { font-size: 22px; color: var(--dim); }
  #reloadtip { font-size: 13px; color: var(--accent2); height: 18px; }
  #slots { display: flex; gap: 6px; justify-content: flex-end; margin-top: 6px; }
  #slots span { font-size: 11px; padding: 2px 7px; border: 1px solid var(--line); color: var(--dim); }
  #slots span.on { border-color: var(--fg); color: var(--fg); }

  #msg { position: absolute; top: 30%; left: 50%; transform: translate(-50%, -50%); text-align: center;
    opacity: 0; transition: opacity 0.4s; text-shadow: 0 2px 8px #000; }
  #msg .m1 { font-size: 44px; font-weight: 900; letter-spacing: 0.08em; }
  #msg .m2 { font-size: 16px; color: var(--accent2); margin-top: 6px; letter-spacing: 0.1em; }

  /* ---------- overlays ---------- */
  .overlay { position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    flex-direction: column; background: rgba(0,0,0,0.55); backdrop-filter: blur(3px); z-index: 10; padding: 16px; }
  .overlay.show { display: flex; }
  #menu { background: linear-gradient(180deg, rgba(0,0,0,0.25) 0%, rgba(0,0,0,0.75) 100%); backdrop-filter: none;
    justify-content: flex-end; padding-bottom: 6vh; }
  .title { font-size: clamp(44px, 8vw, 96px); font-weight: 900; letter-spacing: 0.12em; line-height: 1;
    text-shadow: 0 4px 24px rgba(0,0,0,0.8); }
  .title span { color: var(--accent); }
  .subtitle { font-family: "Oswald"; letter-spacing: 0.6em; color: var(--dim); margin: 10px 0 34px; font-size: 14px; }
  #levels { display: grid; grid-template-columns: repeat(5, minmax(0, 190px)); gap: 12px; max-width: 100%; }
  .card { pointer-events: auto; cursor: pointer; border: 1px solid var(--line); padding: 14px 14px 16px; min-height: 150px;
    position: relative; overflow: hidden; transition: transform 0.15s, border-color 0.15s; text-align: left; color: var(--fg);
    font: inherit; }
  .card:hover:not(.locked) { transform: translateY(-3px); border-color: var(--fg); }
  .card .n { font-family: "Oswald"; font-size: 34px; opacity: 0.35; line-height: 1; }
  .card .nm { font-size: 17px; font-weight: 700; margin-top: 8px; }
  .card .tm { font-size: 11px; letter-spacing: 0.2em; color: var(--accent2); margin-top: 3px; }
  .card .ds { font-size: 12px; color: #cfc8bb; margin-top: 8px; line-height: 1.5; }
  .card.locked { cursor: not-allowed; filter: grayscale(1) brightness(0.5); }
  .card.locked::after { content: "未解鎖"; position: absolute; right: 10px; top: 12px; font-size: 11px; letter-spacing: 0.15em; }
  .t-day { background: linear-gradient(160deg, rgba(90,120,150,0.55), rgba(20,20,20,0.85)); }
  .t-dusk { background: linear-gradient(160deg, rgba(190,100,50,0.55), rgba(20,15,15,0.85)); }
  .t-night { background: linear-gradient(160deg, rgba(30,40,80,0.7), rgba(5,5,10,0.9)); }
  .t-fog { background: linear-gradient(160deg, rgba(130,140,140,0.55), rgba(20,20,20,0.85)); }
  .controls { margin-top: 26px; font-size: 12px; color: var(--dim); letter-spacing: 0.05em; text-align: center; line-height: 1.9; }
  .controls b { color: var(--fg); font-weight: 400; border: 1px solid var(--line); padding: 1px 6px; margin: 0 2px; }
  .panel { background: var(--panel); border: 1px solid var(--line); padding: 34px 44px; text-align: center; min-width: 320px; }
  .panel h2 { font-size: 40px; font-weight: 900; letter-spacing: 0.1em; }
  .panel p { color: var(--dim); margin: 10px 0 22px; line-height: 1.7; }
  .btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  button.b { font: inherit; font-size: 15px; letter-spacing: 0.12em; color: var(--fg); background: transparent;
    border: 1px solid var(--fg); padding: 10px 24px; cursor: pointer; }
  button.b:hover { background: var(--fg); color: #000; }
  button.b.primary { background: var(--accent); border-color: var(--accent); }
  button.b.primary:hover { background: #e2412b; color: #fff; }
  #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #000;
    z-index: 20; letter-spacing: 0.3em; color: var(--dim); }
  .touchnote { display: none; margin-top: 10px; color: var(--accent2); font-size: 13px; }
  .is-touch .touchnote { display: block; }
  .is-touch .keyhelp { display: none; }
  html.is-touch, .is-touch body { overscroll-behavior: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  .is-touch #game { touch-action: none; }

  /* ---------- touch controls ---------- */
  #touch { position: fixed; inset: 0; display: none; z-index: 5; touch-action: none; }
  .is-touch #touch.on { display: block; }
  #stick { position: absolute; width: 130px; height: 130px; margin: -65px 0 0 -65px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.28); background: rgba(0,0,0,0.18); display: none; pointer-events: none; }
  #knob { position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 50%;
    background: rgba(255,255,255,0.35); border: 2px solid rgba(255,255,255,0.6); }
  #stickHint { position: absolute; left: max(40px, env(safe-area-inset-left, 0px)); bottom: 40px; width: 110px; height: 110px;
    border-radius: 50%; border: 2px dashed rgba(255,255,255,0.18); pointer-events: none; }
  .tb { position: absolute; border-radius: 50%; border: 2px solid rgba(255,255,255,0.45); background: rgba(0,0,0,0.3);
    color: #fff; font: 700 13px "Noto Sans TC", sans-serif; display: flex; align-items: center; justify-content: center;
    touch-action: none; -webkit-tap-highlight-color: transparent; }
  .tb.down { background: rgba(255,255,255,0.35); }
  #tFire { width: 92px; height: 92px; right: max(34px, env(safe-area-inset-right, 0px)); bottom: 110px; border-color: rgba(230,70,50,0.8);
    background: rgba(160,30,20,0.35); font-size: 15px; }
  #tAim { width: 62px; height: 62px; right: calc(max(34px, env(safe-area-inset-right, 0px)) + 110px); bottom: 170px; }
  #tJump { width: 62px; height: 62px; right: calc(max(34px, env(safe-area-inset-right, 0px)) + 110px); bottom: 90px; }
  #tReload { width: 54px; height: 54px; right: calc(max(34px, env(safe-area-inset-right, 0px)) + 40px); bottom: 220px; }
  #tSwitch { width: 54px; height: 54px; right: calc(max(34px, env(safe-area-inset-right, 0px)) - 10px); bottom: 26px; border-radius: 12px; width: 110px; }
  #tPause { width: 44px; height: 44px; left: max(16px, env(safe-area-inset-left, 0px)); top: 14px; border-radius: 10px; }
  .is-touch #ammo { bottom: auto; right: auto; top: 128px; left: max(16px, env(safe-area-inset-left, 0px)); text-align: left; }
  .is-touch #msg { top: 42%; }
  #msg { width: min(92vw, 760px); }
  @media (max-width: 500px) { #msg .m1 { font-size: 24px; } #msg .m2 { font-size: 13px; } }
  .is-touch #slots { display: none; }
  .is-touch #health { bottom: auto; top: 70px; left: max(16px, env(safe-area-inset-left, 0px)); width: 180px; }
  .is-touch #hpnum { font-size: 26px; }
  .is-touch #ammonum { font-size: 30px; }
  .is-touch #score { top: 14px; }
  .is-touch #msg .m1 { font-size: 30px; }
  #rotate { position: fixed; inset: 0; z-index: 30; background: #000; display: none; align-items: center; justify-content: center;
    flex-direction: column; gap: 14px; text-align: center; padding: 24px; letter-spacing: 0.1em; }
  #rotate .ph { width: 46px; height: 80px; border: 3px solid var(--fg); border-radius: 8px; animation: rot 2s ease-in-out infinite; }
  @keyframes rot { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(90deg); } }
  @media (orientation: portrait) { .is-touch:not(.allow-portrait) #rotate { display: flex; } }
  #rotate button { margin-top: 8px; }
  .card.sel { border-color: var(--accent2); box-shadow: 0 0 0 2px var(--accent2); }
  .padhelp, .has-pad .is-touch .padhelp { display: none; }
  .has-pad .padhelp { display: block; margin-top: 6px; color: var(--accent2); }
  .menubtns { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 12px; }
  .menubtns .b { font-size: 13px; padding: 6px 16px; }
  #bestiary .panel { width: min(880px, 100%); max-height: 88vh; overflow-y: auto; text-align: left; }
  #bestiary h2 { text-align: center; }
  #zlist { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; margin: 18px 0 20px; }
  .zc { border: 1px solid var(--line); padding: 12px 14px; display: grid; gap: 6px; align-content: start; }
  .zc .zh { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 16px; }
  .zc .dot { width: 12px; height: 12px; border-radius: 50%; flex: none; }
  .zc .first { font-size: 11px; color: var(--accent2); letter-spacing: 0.1em; }
  .zc .zd { font-size: 12.5px; color: #cfc8bb; line-height: 1.6; }
  .zc .unk { color: var(--dim); }
  .zc .bars { display: grid; grid-template-columns: 34px 1fr; gap: 3px 8px; font-size: 11px; color: var(--dim); align-items: center; }
  .zc .bar { height: 4px; background: rgba(255,255,255,0.1); }
  .zc .bar i { display: block; height: 100%; background: var(--fg); }
  #nosupport { display: none; }
  @media (max-height: 520px) {
    #menu { justify-content: flex-start; padding-top: 14px; padding-bottom: 14px; overflow-y: auto; }
    .title { font-size: 40px; } .subtitle { margin: 4px 0 12px; }
    #menu #levels { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
    .card { min-height: 0; padding: 10px; } .card .n { font-size: 22px; } .card .ds { display: none; }
    .controls { margin-top: 10px; }
    .panel { padding: 20px 26px; } .panel h2 { font-size: 28px; }
  }
  @media (max-width: 1000px) { #levels { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
</style>
<script async src="./vendor/es-module-shims.js"></script>

  "three": "./vendor/three/three.module.js",
  "three/addons/": "./vendor/three/addons/"
} }

<body>
<div id="game"></div>
<div id="vignette"></div>
<div id="hurt"></div>
<div id="acidfx"></div>

<div id="hud">
  <div id="crosshair"><i class="t"></i><i class="b"></i><i class="l"></i><i class="r"></i><i class="d"></i></div>
  <div id="hitmark"></div>
  <div id="topbar"><div id="lvname"></div><div id="wave"></div><div id="remain"></div></div>
  <div id="score"><div class="small">擊殺</div><div class="big num" id="kills">0</div>
    <div class="small">分數 <span class="num" id="pts">0</span></div></div>
  <div id="health"><div class="label">生命值</div><div id="hpnum" class="num">100</div>
    <div id="hpbar"><div id="hpfill"></div></div></div>
  <div id="ammo"><div id="wname"></div><div id="reloadtip"></div>
    <div id="ammonum" class="num">12 <small>/ 72</small></div>
    <div id="slots"><span>1 手槍</span><span>2 步槍</span><span>3 霰彈槍</span></div></div>
  <div id="msg"><div class="m1"></div><div class="m2"></div></div>
</div>

<div id="menu" class="overlay show">
  <div class="title">死城<span>突圍</span></div>
  <div class="subtitle">DEAD CITY</div>
  <div id="levels"></div>
  <div class="menubtns"><button class="b" id="btnBestiary">感染者圖鑑</button><button class="b" id="quality">畫質：自動</button></div>
  <div class="controls">
    <span class="keyhelp"><b>W A S D</b> 移動　<b>Shift</b> 衝刺　<b>空白鍵</b> 跳躍　<b>滑鼠左鍵</b> 射擊　<b>右鍵</b> 瞄準<br>
    <b>R</b> 換彈　<b>1 2 3</b> / 滾輪 切換武器　<b>Esc</b> 暫停　·　</span>爆頭傷害 ×2.5
    <div class="padhelp">已連接手把：左右選擇關卡，A 開始。</div>
    <div class="touchnote">觸控模式：左半邊拖曳移動（推到底會衝刺），右半邊滑動轉視角，按住「射擊」可邊射邊轉。</div>
  </div>
</div>

<div id="pause" class="overlay"><div class="panel"><h2>暫停</h2><p>點擊「繼續」回到戰場</p>
  <div class="btns"><button class="b primary" id="btnResume">繼續</button><button class="b" id="btnQuit">返回選單</button></div></div></div>

<div id="dead" class="overlay"><div class="panel"><h2 style="color:var(--accent)">你已陣亡</h2><p id="deadStats"></p>
  <div class="btns"><button class="b primary" id="btnRetry">重新挑戰</button><button class="b" id="btnQuit2">返回選單</button></div></div></div>

<div id="bestiary" class="overlay"><div class="panel"><h2>感染者圖鑑</h2><div id="zlist"></div>
  <div class="btns"><button class="b" id="btnCloseBestiary">關閉</button></div></div></div>

<div id="win" class="overlay"><div class="panel"><h2>區域已肅清</h2><p id="winStats"></p>
  <div class="btns"><button class="b primary" id="btnNext">下一關</button><button class="b" id="btnQuit3">返回選單</button></div></div></div>

<div id="touch">
  <div id="stickHint"></div>
  <div id="stick"><div id="knob"></div></div>
  <div class="tb" id="tFire">射擊</div>
  <div class="tb" id="tAim">瞄準</div>
  <div class="tb" id="tJump">跳</div>
  <div class="tb" id="tReload">換彈</div>
  <div class="tb" id="tSwitch">換槍</div>
  <div class="tb" id="tPause">❚❚</div>
</div>
<div id="rotate"><div class="ph"></div><div>橫放手機，畫面和操作空間比較大</div><button class="b" id="btnPortrait">直接直向玩</button></div>

<div id="loading">載入中…</div>
<script>
  setTimeout(function () {
    var l = document.getElementById('loading');
    if (l && l.style.display !== 'none' && !l.dataset.err) {
      l.innerHTML = '載入失敗。請確認網路連線正常，<br>或改用最新版的 Chrome、Safari、Edge 或 Firefox。';
      l.style.textAlign = 'center'; l.style.lineHeight = '2'; l.style.padding = '24px';
    }
  }, 15000);
</script>

<script type="module">
import * as THREE from 'three';
import { Sky } from 'three/addons/objects/Sky.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// ============================================================
//  Levels — add more entries here to add more levels
// ============================================================
const LEVELS = [
  { name: '市中心', theme: 'downtown', time: 'day', desc: '商業區的高樓間，第一批感染者正在聚集。',
    hpMul: 1, speedMul: 1, waves: [{ walker: 6 }, { walker: 10, runner: 2 }, { walker: 12, runner: 3, crawler: 4 }] },
  { name: '黃昏住宅區', theme: 'suburb', time: 'dusk', desc: '寧靜的郊區已經淪陷，腫脹的爆炸者在院子裡徘徊。',
    hpMul: 1.1, speedMul: 1.05, waves: [{ walker: 10, runner: 3, crawler: 3 }, { walker: 12, runner: 5, bloater: 2 }, { walker: 12, runner: 8, bloater: 3, crawler: 3, brute: 1 }] },
  { name: '夜間港區', theme: 'industrial', time: 'night', desc: '貨櫃堆之間一片漆黑，吐酸者躲在暗處，尖叫者會引來屍群。',
    hpMul: 1.2, speedMul: 1.1, waves: [{ walker: 12, runner: 4, crawler: 3 }, { walker: 12, runner: 6, spitter: 2, bloater: 2 }, { walker: 14, runner: 8, spitter: 3, screamer: 1, brute: 1 }, { runner: 14, spitter: 4, bloater: 3, screamer: 1, brute: 2 }] },
  { name: '濃霧市區', theme: 'downtown', time: 'fog', desc: '濃霧吞沒了街道，穿著防彈裝備的感染者出現了。',
    hpMul: 1.3, speedMul: 1.15, waves: [{ walker: 14, runner: 6, armored: 2 }, { walker: 14, runner: 8, crawler: 4, spitter: 3, armored: 3 }, { walker: 16, runner: 12, screamer: 2, bloater: 4, brute: 2 }, { runner: 18, armored: 5, spitter: 4, crawler: 4, brute: 3 }] },
  { name: '警察局', theme: 'police', time: 'night', desc: '市警局已經淪陷。感染的警察舉著防暴盾牌衝來，還有人拿著槍。',
    hpMul: 1.35, speedMul: 1.15, waves: [{ walker: 12, riot: 4 }, { walker: 12, runner: 6, riot: 5, gunner: 2 }, { walker: 12, runner: 8, riot: 6, gunner: 4, crawler: 4 }, { runner: 12, riot: 8, gunner: 6, armored: 3, brute: 2 }] },
  // levels 6–9 are still to be made; the finale stays numbered 10 and is hidden from the menu until they exist
  { num: 10, hidden: true, name: '最後防線', theme: 'downtown', time: 'night', desc: '撤離直升機抵達前，守住市中心。所有種類的感染者都會出現。',
    hpMul: 1.6, speedMul: 1.25, waves: [{ walker: 18, runner: 10, crawler: 5 }, { walker: 18, runner: 12, spitter: 4, bloater: 4, riot: 4, brute: 2 }, { walker: 20, runner: 14, armored: 5, gunner: 4, screamer: 2, brute: 3 }, { walker: 16, runner: 18, spitter: 5, bloater: 5, riot: 6, crawler: 5, brute: 4 }, { runner: 26, armored: 6, gunner: 6, screamer: 3, spitter: 5, bloater: 4, brute: 6 }] },
];

const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const $ = (id) => document.getElementById(id);

function makeCanvas(w, h = w) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; return [c, c.getContext('2d')];
}
function toTex(c, srgb = true) {
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = MAXANISO;
  return t;
}
function speckle(ctx, w, h, n, alpha, smin = 1, smax = 2.5) {
  for (let i = 0; i < n; i++) {
    const v = Math.random() < 0.5 ? 0 : 255;
    ctx.fillStyle = `rgba(${v},${v},${v},${alpha * Math.random()})`;
    const s = rand(smin, smax);
    ctx.fillRect(Math.random() * w, Math.random() * h, s, s);
  }
}
// radial blotches that wrap around the edges so the texture tiles seamlessly
function blotches(ctx, w, h, n, rgb, rmin, rmax, alpha) {
  for (let i = 0; i < n; i++) {
    const x = Math.random() * w, y = Math.random() * h, r = rand(rmin, rmax), a = alpha * rand(0.4, 1);
    for (const ox of [-w, 0, w]) for (const oy of [-h, 0, h]) {
      const cx = x + ox, cy = y + oy;
      if (cx + r < 0 || cx - r > w || cy + r < 0 || cy - r > h) continue;
      const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
      g.addColorStop(0, `rgba(${rgb},${a})`); g.addColorStop(1, `rgba(${rgb},0)`);
      ctx.fillStyle = g; ctx.fillRect(cx - r, cy - r, r * 2, r * 2);
    }
  }
}
function scaleBoxUV(geo, w, h, d, tw, th) {
  const uv = geo.attributes.uv;
  const dims = [[d, h], [d, h], [w, d], [w, d], [w, h], [w, h]];
  for (let f = 0; f < 6; f++) for (let k = 0; k < 4; k++) {
    const i = f * 4 + k;
    uv.setXY(i, uv.getX(i) * dims[f][0] / tw, uv.getY(i) * dims[f][1] / th);
  }
  uv.needsUpdate = true;
}

// 512px tile = 4 bays (4 m each) x 4 floors (3.5 m each) → one tile covers 16 m x 14 m
function facadeTex(style, v) {
  const S = 512, B = 128;
  const [c, x] = makeCanvas(S); const [ce, xe] = makeCanvas(S);
  xe.fillStyle = '#000'; xe.fillRect(0, 0, S, S);
  const glass = (wx, wy, ww, wh) => {
    const gr = x.createLinearGradient(wx, wy, wx + ww, wy + wh);
    const t = rand(-8, 8);
    gr.addColorStop(0, `rgb(${40 + t},${55 + t},${70 + t})`); gr.addColorStop(0.55, `rgb(${70 + t},${88 + t},${104 + t})`);
    gr.addColorStop(1, `rgb(${30 + t},${40 + t},${52 + t})`);
    x.fillStyle = gr; x.fillRect(wx, wy, ww, wh);
    if (Math.random() < 0.35) { x.fillStyle = `rgba(200,190,170,${rand(0.15, 0.35)})`; x.fillRect(wx + 2, wy + 2, ww * rand(0.2, 0.9), wh * rand(0.3, 0.7)); } // blinds

function resolve(p, r) {
  for (const b of colliders) {
    if (p.x < b.x0 - r || p.x > b.x1 + r || p.z < b.z0 - r || p.z > b.z1 + r) continue;
    const cx = clamp(p.x, b.x0, b.x1), cz = clamp(p.z, b.z0, b.z1);
    const dx = p.x - cx, dz = p.z - cz, d2 = dx * dx + dz * dz;
    if (d2 >= r * r) continue;
    if (d2 > 1e-8) { const d = Math.sqrt(d2); p.x = cx + dx / d * r; p.z = cz + dz / d * r; }
    else {
      const pl = p.x - b.x0, pr = b.x1 - p.x, pb = p.z - b.z0, pf = b.z1 - p.z, m = Math.min(pl, pr, pb, pf);
      if (m === pl) p.x = b.x0 - r; else if (m === pr) p.x = b.x1 + r; else if (m === pb) p.z = b.z0 - r; else p.z = b.z1 + r;
    }
  }
}
function blocked(x, z, r) {
  for (const b of colliders) if (x > b.x0 - r && x < b.x1 + r && z > b.z0 - r && z < b.z1 + r) return true;
  return false;
}

let actx = null, master = null, noiseBuf = null;
function audio() {
  if (!actx) {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    master = actx.createGain(); master.gain.value = 0.5; master.connect(actx.destination);
    noiseBuf = actx.createBuffer(1, actx.sampleRate * 1.5, actx.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  if (actx.state === 'suspended') actx.resume();
  return actx;
}

  const f = a.createBiquadFilter(); f.type = type; f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t + dur);
  const g = a.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  src.connect(f).connect(g).connect(master); src.start(t, Math.random()); src.stop(t + dur + 0.05);

    case 'rifle': sNoise(t, 0.18, 6000, 500, 0.8); sTone(t, 0.1, 140, 45, 0.8); break;
    case 'shotgun': sNoise(t, 0.5, 3500, 200, 1.3); sTone(t, 0.25, 110, 35, 1.0); break;
    case 'empty': sTone(t, 0.04, 1800, 1200, 0.15, 'square'); break;
    case 'reload': sTone(t, 0.05, 900, 600, 0.2, 'square'); sTone(t + 0.35, 0.06, 700, 400, 0.25, 'square'); break;
    case 'hit': sNoise(t, 0.08, 1200, 300, 0.35 * vol, 'bandpass'); break;

    case 'pickup': sTone(t, 0.08, 600, 900, 0.25, 'triangle'); sTone(t + 0.08, 0.1, 900, 1300, 0.25, 'triangle'); break;

// ============================================================

function loadUnlocked() { try { return +localStorage.getItem('deadcity_unlocked') || 0; } catch { return 0; } }

  zombies.forEach((z) => z.remove()); zombies = []; zMeshes = [];
  particles.forEach((p) => scene.remove(p.m)); particles = [];
  decals.forEach((d) => scene.remove(d)); decals = [];
  pickups.forEach((p) => scene.remove(p.m)); pickups = [];
  spits.forEach((p) => scene.remove(p.m)); spits = [];
  tracers.forEach((t) => scene.remove(t.l)); tracers = []; acidPools = []; boomT = 0; boomLight.intensity = 0; acidFlash = 0;
}

function loadLevel(i) {

}

function startLevel(i) {

  } else if (!padActive) lockPointer();
}

    if (reloading <= 0) { const need = w.c.mag - w.ammo, take = Math.min(need, w.reserve); w.ammo += take; w.reserve -= take; }
  }
  if ((mouseDown || pad.fire) && w.c.auto) tryFire(false);
  kick = Math.max(0, kick - dt * 10);
  const hs = Math.hypot(player.vel.x, player.vel.z) / 5;
  const hip = v.hip.clone(); if (gunCam.aspect < 1) { hip.x *= 0.45; hip.z -= 0.08; }
  const pos = hip.lerp(v.aim, aimT);
  const bobA = (1 - aimT * 0.85);
  pos.x += Math.cos(player.bob) * 0.012 * hs * bobA;
  pos.y += Math.abs(Math.sin(player.bob)) * 0.012 * hs * bobA;
  pos.z += kick * 0.06 * (aimT > 0.5 ? 0.6 : 1);
  const rl = reloading > 0 ? Math.sin(Math.min(1, 1 - reloading / w.c.reload) * Math.PI) : 0;
  const sw = switching > 0 ? switching / 0.35 : 0;
  pos.y -= rl * 0.12 + sw * 0.3;
  v.group.position.copy(pos);
  v.group.rotation.set(kick * 0.12 - rl * 0.5, 0, rl * 0.4);
  v.flash.visible = flashT > 0;
  if (flashT > 0) { v.flash.material.rotation = rand(0, 6); v.flash.scale.setScalar(rand(0.16, 0.28) * (w.c.id === 'shotgun' ? 1.4 : 1)); }
  flashT -= dt;
  muzzleLight.intensity = flashT > 0 ? 45 : 0; gunMuzzle.intensity = flashT > 0 ? 6 : 0;
  gunMuzzle.position.copy(pos).add(v.muzzle);
}

function updateZombies(dt) {
  zombies = zombies.filter((z) => { const keep = z.update(dt); if (!keep) z.remove(); return keep; });
  groanT -= dt;
  if (groanT <= 0) {
    groanT = rand(1.2, 3);
    const near = zombies.filter((z) => !z.dead);
    if (near.length) groan(pick(near));
  }
}

function updatePickups(dt) {
  pickups = pickups.filter((p) => {
    p.t += dt; p.life -= dt;
    p.m.rotation.y += dt * 1.5; p.m.position.y = 0.4 + Math.sin(p.t * 3) * 0.08;
    if (Math.hypot(p.m.position.x - player.pos.x, p.m.position.z - player.pos.z) < 1.3) {
      if (p.kind === 'med') { if (player.hp >= 100) return true; player.hp = Math.min(100, player.hp + 35); showMsg('', '+35 生命值', 1); }
      else { weapons.forEach((w) => { w.reserve += Math.round(w.c.mag * (w === weapons[wi] ? 1.5 : 0.7)); }); showMsg('', '彈藥補給', 1); }
      sfx('pickup'); scene.remove(p.m); return false;
    }
    if (p.life <= 0) { scene.remove(p.m); return false; }
    return true;
  });
}

function updateParticles(dt) {
  particles = particles.filter((p) => {
    p.life -= dt; p.v.y -= 9.8 * dt; p.m.position.addScaledVector(p.v, dt);
    if (p.m.position.y < 0.02) { p.m.position.y = 0.02; p.v.set(0, 0, 0); }
    if (p.life <= 0) { scene.remove(p.m); return false; }
    return true;
  });
}

function updateLighting(dt) {
  const focus = state === 'playing' || state === 'paused' ? player.pos : new THREE.Vector3(0, 0, 0);
  sun.position.copy(focus).addScaledVector(sunDir, 150); sun.target.position.copy(focus);
  lampT -= dt;
  if (lampT <= 0 && TM.night) {
    lampT = 0.5;
    const sorted = lampPositions.slice().sort((a, b) => a.distanceToSquared(camera.position) - b.distanceToSquared(camera.position));
    LAMP_LIGHTS.forEach((l, i) => { if (sorted[i]) { l.position.copy(sorted[i]); l.intensity = sorted[i].y < 4 ? 14 : 70; } });
  } else if (!TM.night) LAMP_LIGHTS.forEach((l) => (l.intensity = 0));
  // flashing police light bars
  if (POLICE_CARS.length && M.lightRed) {
    copFlash += dt;
    const ph = Math.floor(copFlash * 6) % 4, red = ph === 0 || ph === 1 ? 1 : 0, blue = 1 - red;
    const blink = Math.floor(copFlash * 12) % 2 ? 1 : 0.35;
    M.lightRed.emissiveIntensity = red * 6 * blink; M.lightBlue.emissiveIntensity = blue * 6 * blink;
    copLightT -= dt;
    if (copLightT <= 0) {
      copLightT = 0.5;
      let best = null, bd = Infinity;
      for (const p of POLICE_CARS) { const d = p.distanceToSquared(camera.position); if (d < bd) { bd = d; best = p; } }
      COP_LIGHTS.forEach((l) => l.position.copy(best));
    }
    COP_LIGHTS[0].intensity = red * blink * 40; COP_LIGHTS[1].intensity = blue * blink * 40;
  } else COP_LIGHTS.forEach((l) => (l.intensity = 0));
}

let last = performance.now();
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  frame(dt, now);
}
function frame(dt, now) {
  pollPad(dt);
  if (state === 'playing') autoQuality(dt);
  if (state === 'playing') {
    updatePlayer(dt); updateWeapon(dt); updateZombies(dt); updateHazards(dt); updateWaves(dt); updatePickups(dt);
    updateHUD();
  } else if (state === 'menu') {
    menuT += dt;
    const a = menuT * 0.04;
    camera.position.set(ROAD_CENTERS[3] + Math.sin(a) * 6, 5 + Math.sin(a * 0.7) * 1.5, blockCenter(4) - menuT * 0.8 % 200);
    camera.fov = 60; camera.updateProjectionMatrix();
    camera.lookAt(camera.position.x, 7, camera.position.z - 40);
    gunRoot.visible = false;
  }
  gunRoot.visible = state !== 'menu';
  updateParticles(dt); updateLighting(dt);
  if (msgTimer > 0) { msgTimer -= dt; if (msgTimer <= 0) $('msg').style.opacity = 0; }
  if (hitTimer > 0) { hitTimer -= dt; if (hitTimer <= 0) $('hitmark').style.opacity = 0; }
  hurtAlpha = Math.max(0, hurtAlpha - dt * 1.2);
  const low = state === 'playing' && player.hp < 30 ? 0.35 + Math.sin(now / 250) * 0.1 : 0;
  $('hurt').style.opacity = Math.max(hurtAlpha, low);
  composer.render(dt);
}

// ============================================================
//  Boot
// ============================================================
buildTextures();
loadLevel(0);
applyQuality(qLevel);
resetWeapons();
renderMenu();
$('loading').style.display = 'none';
requestAnimationFrame(loop);
window.__game = { get state() { return state; }, player, zombies: () => zombies, startLevel, spawnZombie,
  tick(n = 1, dt = 1 / 60) { for (let i = 0; i < n; i++) frame(dt, performance.now()); }, fire: () => tryFire(true),
  spawnNear(type, d = 8) { const z = new Zombie(type, player.pos.x + rand(-2, 2), player.pos.z - d); zombies.push(z); return z; } };
</script>
</body>
